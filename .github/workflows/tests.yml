name: Pruebas de Clip Libre
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FFmpeg Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Instalar.bat real sin pausa en Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmd /d /c "Instalar.bat --sin-pausa"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -m pip check
          exit $LASTEXITCODE
      - name: RepararGPU.bat y carga real de DLL NVIDIA en Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmd /d /c "RepararGPU.bat --sin-pausa"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -m cliplivre.gpu_runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -m pip check
          exit $LASTEXITCODE
