<!doctype html><html lang="es"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#0d1323;color:#e5ebfa;font:13px Arial,sans-serif}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}button{border:1px solid #384965;background:#152039;color:#e5ebfa;border-radius:6px;padding:8px 12px;cursor:pointer}button.active{background:#2866ed;border-color:#4485ff}.views{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:14px}canvas{max-width:100%;display:block;border-radius:8px;background:#05070d;touch-action:none}.muted{color:#9baac3;padding:8px 0}#source{cursor:move}@media(max-width:620px){.views{grid-template-columns:minmax(0,1fr) 100px}}
</style><div class="toolbar"><button id="play">▶ Reproducir</button><button id="mute">Audio: sí</button><span id="time">0:00</span><input id="seek" type="range" min="0" max="100" value="0" style="flex:1"></div><video id="video" crossorigin="anonymous" playsinline preload="metadata" style="display:none"></video><div class="toolbar" id="buttons"></div><div class="views"><canvas id="source"></canvas><canvas id="portrait" width="180" height="320"></canvas></div><div class="muted">Arrastra el recuadro para moverlo. Arrastra su esquina para cambiar tamaño. La imagen es una guía; el video final se comprueba con la vista previa.</div><script>
const send=(type,rest={})=>parent.postMessage({isStreamlitMessage:true,type,...rest},'*');
const s=document.querySelector('#source'),p=document.querySelector('#portrait'),ctx=s.getContext('2d'),out=p.getContext('2d');

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function draw(){if(!img.naturalWidth||!panels.length)return;const picture=video.readyState>=2&&!videoFailed?video:img;const iw=picture.videoWidth||img.naturalWidth,ih=picture.videoHeight||img.naturalHeight;const sourcePicture=panels[active].kind==='image'&&photo.naturalWidth?photo:picture;const siw=sourcePicture.videoWidth||sourcePicture.naturalWidth||iw,sih=sourcePicture.videoHeight||sourcePicture.naturalHeight||ih;const cw=Math.round(Math.min(900,siw,480*siw/sih)),ch=Math.round(cw*sih/siw);if(s.width!==cw||s.height!==ch){s.width=cw;s.height=ch;requestAnimationFrame(()=>send('streamlit:setFrameHeight',{height:Math.max(s.getBoundingClientRect().height,p.getBoundingClientRect().height)+110}));}ctx.clearRect(0,0,s.width,s.height);ctx.drawImage(sourcePicture,0,0,s.width,s.height);ctx.fillStyle='#0008';ctx.fillRect(0,0,s.width,s.height);let r=panels[active].source;ctx.drawImage(sourcePicture,r[0]*siw,r[1]*sih,r[2]*siw,r[3]*sih,r[0]*s.width,r[1]*s.height,r[2]*s.width,r[3]*s.height);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(r[0]*s.width,r[1]*s.height,r[2]*s.width,r[3]*s.height);ctx.fillStyle='#fff';ctx.fillRect((r[0]+r[2])*s.width-6,(r[1]+r[3])*s.height-6,12,12);
out.fillStyle='#05070d';out.fillRect(0,0,p.width,p.height);
for(const panel of panels){let frame=panel.kind==='image'&&photo.naturalWidth?photo:picture,fw=frame.videoWidth||frame.naturalWidth||iw,fh=frame.videoHeight||frame.naturalHeight||ih;let [x,y,w,h]=panel.source,[dx,dy,dw,dh]=panel.destination;let sw=w*fw,sh=h*fh,tw=dw*p.width,th=dh*p.height;let scale=panel.fit==='contain'?Math.min(tw/sw,th/sh):Math.max(tw/sw,th/sh);out.save();out.beginPath();out.rect(dx*p.width,dy*p.height,tw,th);out.clip();out.drawImage(frame,x*fw,y*fh,sw,sh,dx*p.width+(tw-sw*scale)/2,dy*p.height+(th-sh*scale)/2,sw*scale,sh*scale);out.restore();}
if(logo.naturalWidth){let lw=p.width*.17,lh=lw*logo.naturalHeight/logo.naturalWidth;out.drawImage(logo,p.width*.79,p.height*.03,lw,lh);}
if(args.burn&&args.words?.length){let t=(video.currentTime||args.start||0)+(args.time_origin||0);let k=args.words.findIndex(w=>w.start<=t&&w.end>=t);if(k>=0){let group=args.words.slice(Math.floor(k/6)*6,Math.floor(k/6)*6+6),font=Math.max(10,(args.subtitle_size||54)*p.width/1080);out.font=`bold ${font}px Arial`;let widths=group.map(w=>out.measureText(w.text+' ').width),left=(p.width-widths.reduce((a,b)=>a+b,0))/2;let y=args.subtitle_position===8?p.height*.12:args.subtitle_position===5?p.height*.5:p.height*.88;out.textAlign='left';out.textBaseline='middle';group.forEach((w,i)=>{out.strokeStyle='#000';out.lineWidth=2;out.strokeText(w.text,left,y);out.fillStyle=w.start<=t&&w.end>=t?(args.subtitle_color||'#ffff00'):'#ffffff';out.fillText(w.text,left,y);left+=widths[i];});}}
for(const title of args.titles||[]){let relative=(video.currentTime||args.start||0)-(args.start||0);if(relative<title.start||relative>title.end)continue;out.font=`bold ${Math.max(9,title.size*p.width/1080)}px Arial`;out.textAlign='center';out.textBaseline='middle';out.fillStyle=title.color||'#ffffff';out.strokeStyle='#000';out.lineWidth=2;out.strokeText(title.text,p.width*title.x,p.height*title.y);out.fillText(title.text,p.width*title.x,p.height*title.y);}
if(args.text){out.fillStyle=args.text_color||'#fff';out.strokeStyle='#000';out.lineWidth=2;out.font=`bold ${Math.max(9,(args.text_size||64)*p.width/1080)}px Arial`;out.textAlign='center';out.textBaseline='middle';let lines=args.text.split('\n');lines.forEach((line,i)=>{const x=(args.text_x??.5)*p.width,y=(args.text_y??.15)*p.height+i*15;out.strokeText(line,x,y);out.fillText(line,x,y);});}}
function buttons(){let root=document.querySelector('#buttons');root.innerHTML='<b>Zona del original</b>';panels.forEach((_,i)=>{let b=document.createElement('button');b.textContent=`Cuadro ${i+1}`;b.className=i===active?'active':'';b.onclick=()=>{active=i;buttons();draw();};root.append(b);});}
function point(e){const r=s.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];}
s.onpointerdown=e=>{let [x,y]=point(e),r=panels[active]?.source;if(!r)return;const corner=Math.abs(x-r[0]-r[2])<.04&&Math.abs(y-r[1]-r[3])<.06;if(!corner&&(x<r[0]||y<r[1]||x>r[0]+r[2]||y>r[1]+r[3]))return;drag={start:[x,y],roi:[...r],resize:corner};s.setPointerCapture(e.pointerId);};
s.onpointermove=e=>{if(!drag)return;let [x,y]=point(e),[a,b,w,h]=drag.roi;if(drag.resize){w=clamp(w+x-drag.start[0],.03,1-a);h=clamp(h+y-drag.start[1],.03,1-b);let d=panels[active].destination;let ratio=(d[2]*p.width/(d[3]*p.height))/((panels[active].kind==='image'&&photo.naturalWidth)?photo.naturalWidth/photo.naturalHeight:img.width/img.height);if(panels[active].fit!=='contain'){w=Math.min(w,(1-b)*ratio);h=w/ratio;}}else{a=clamp(a+x-drag.start[0],0,1-w);b=clamp(b+y-drag.start[1],0,1-h);}panels[active].source=[a,b,w,h];draw();};
s.onpointerup=e=>{if(!drag)return;drag=null;s.releasePointerCapture(e.pointerId);revision=Date.now();send('streamlit:setComponentValue',{value:{panels,revision},dataType:'json'});};

video.onloadedmetadata=()=>{video.currentTime=args.start||0;};video.onseeked=draw;
video.onerror=()=>{videoFailed=true;document.querySelector('#time').textContent='Formato no reproducible: usa Vista previa editada';draw();};
video.ontimeupdate=()=>{const begin=args.start||0,end=args.end||video.duration;if(video.currentTime>=end){video.pause();document.querySelector('#play').textContent='▶ Reproducir';}document.querySelector('#seek').value=100*(video.currentTime-begin)/Math.max(.01,end-begin);let t=Math.max(0,video.currentTime-begin);document.querySelector('#time').textContent=`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;};
document.querySelector('#play').onclick=()=>{if(video.paused){if(video.currentTime>=(args.end||video.duration)-.1)video.currentTime=args.start||0;video.play().then(()=>document.querySelector('#play').textContent='❚❚ Pausar').catch(()=>{});}else{video.pause();document.querySelector('#play').textContent='▶ Reproducir';}};
document.querySelector('#mute').onclick=()=>{video.muted=!video.muted;document.querySelector('#mute').textContent=video.muted?'Audio: no':'Audio: sí';};
document.querySelector('#seek').oninput=e=>{video.currentTime=(args.start||0)+(Number(e.target.value)/100)*((args.end||video.duration)-(args.start||0));draw();};
function animate(){if(!video.paused)draw();requestAnimationFrame(animate);}animate();
send('streamlit:componentReady',{apiVersion:1});
</script></html>
